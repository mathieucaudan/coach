<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b2135">
  <title>Maintenance en cours | Coach GestionMarine</title>
  <style>
    :root{color-scheme:dark;--bg:#0b2135;--text:#f1f8fc;--muted:#aabecb;--accent:#5bcfd0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 70% 10%,#19465a 0,transparent 52%),radial-gradient(ellipse at 12% 88%,#12394c 0,transparent 48%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{text-align:center;width:min(100%,590px)}
    .icon{width:80px;height:80px;margin:0 auto 28px;display:grid;place-items:center;border:1px solid #376f80;border-radius:22px;background:#133549}
    .icon svg{width:46px;height:46px}
    .name{margin:0 0 32px;font-size:15px;font-weight:750;letter-spacing:.15em;text-transform:uppercase;color:#e5f9fb}
    .status{display:inline-flex;gap:9px;align-items:center;padding:9px 15px;border-radius:999px;border:1px solid #356276;background:#15394e;color:#c0e5ea;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .status span{width:8px;height:8px;background:var(--accent);border-radius:50%}
    h1{margin:24px 0 20px;font-size:clamp(38px,7.5vw,58px);line-height:1.1;letter-spacing:-.045em}
    .description{margin:0 auto;max-width:490px;color:var(--muted);font-size:clamp(16px,2.5vw,18px);line-height:1.7}
    .line{height:1px;max-width:365px;margin:37px auto 20px;background:linear-gradient(90deg,transparent,#3e6576,transparent)}
    .foot{margin:0;color:#8eaab7;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 35V13m0 22h30" stroke="#DDF6F8" stroke-width="3" stroke-linecap="round"/>
        <path d="m14 29 9-10 7 6 8-13" stroke="#59D0D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="name">Coach · GestionMarine</p>
    <div class="status"><span aria-hidden="true"></span> Maintenance temporaire</div>
    <h1>Nous revenons<br>très bientôt.</h1>
    <p class="description">La plateforme Coach GestionMarine est momentanément indisponible en raison d'une intervention technique. Merci de réessayer un peu plus tard.</p>
    <div class="line"></div>
    <p class="foot">Merci de votre compréhension.</p>
  </main>
</body>
</html>
